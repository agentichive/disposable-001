name: VS60 smoke
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  statuses: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: whitespace
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.whitespace.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=success
          if [ "$RESULT" != success ]; then state=failure; fi
          payload=$(printf '{"state":"%s"}' "$state")
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" >/dev/null
      - if: steps.whitespace.outcome != success
        run: exit 1
